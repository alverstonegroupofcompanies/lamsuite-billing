name: Release Auto-Updatable Windows App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v2.0.1)'
        required: false
        default: ''

jobs:
  build-and-release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Web Assets
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://api.lamstonehealthcare.com
          VITE_ADMIN_PORTAL_URL: https://admin.lamstonehealthcare.com
        run: npm run build

      - name: Build & Publish Tauri Release (with Updater Manifest)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: ./frontend
          tagName: ${{ github.event.inputs.tag_name || github.ref_name }}
          releaseName: 'LamSuite Billing ${{ github.event.inputs.tag_name || github.ref_name }}'
          releaseBody: |
            ## LamSuite Billing Desktop Release
            Automated production build with self-updating capabilities.
            
            ### Included in this release:
            - Windows NSIS Single-file Installer (`.exe`)
            - Minisign Updater Signature (`.sig`)
            - Auto-updater Manifest (`latest.json`)
          releaseDraft: false
          prerelease: false
