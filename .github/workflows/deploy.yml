name: Build, Test & Deploy Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/lamsuite-backend
  IMAGE_PANEL: ghcr.io/${{ github.repository_owner }}/lamsuite-panel
  IMAGE_MCP: ghcr.io/${{ github.repository_owner }}/lamsuite-mcp

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Test & Quality Gate
  # ----------------------------------------------------------------------------
  test:
    name: Automated Unit & Security Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, sqlite3, pdo_sqlite, bcmath, pcntl
          coverage: none

      - name: Install Backend Dependencies
        run: |
          cd backend
          composer install --prefer-dist --no-progress

      - name: Run Backend PHPUnit Suite
        run: |
          cd backend
          ./vendor/bin/phpunit

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test MCP Server
        run: |
          cd mcp-server
          npm ci
          npm test

      - name: Test Admin Panel Build
        run: |
          cd admin-panel
          npm ci
          npm run build

  # ----------------------------------------------------------------------------
  # Job 2: Build & Push Multi-Stage Production Images
  # ----------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Docker Images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BACKEND }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Metadata (Panel)
        id: meta-panel
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PANEL }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push Panel Image
        uses: docker/build-push-action@v5
        with:
          context: ./admin-panel
          push: true
          tags: ${{ steps.meta-panel.outputs.tags }}
          labels: ${{ steps.meta-panel.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Metadata (MCP)
        id: meta-mcp
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_MCP }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push MCP Image
        uses: docker/build-push-action@v5
        with:
          context: ./mcp-server
          push: true
          tags: ${{ steps.meta-mcp.outputs.tags }}
          labels: ${{ steps.meta-mcp.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # Job 3: Zero-Downtime Deploy & Rollback Gate
  # ----------------------------------------------------------------------------
  deploy:
    name: Deploy to Production Host & Health Gate
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          COMMIT_SHA: ${{ github.sha }}
          IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/lamsuite-backend
          IMAGE_PANEL: ghcr.io/${{ github.repository_owner }}/lamsuite-panel
          IMAGE_MCP: ghcr.io/${{ github.repository_owner }}/lamsuite-mcp
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER || 'deploy' }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: COMMIT_SHA,IMAGE_BACKEND,IMAGE_PANEL,IMAGE_MCP
          script: |

            set -euo pipefail
            cd /opt/lamsuite

            # Remember the last recorded deployment tag.
            PREV_TAG=$(cat .current_deploy_tag 2>/dev/null || true)
            if [ -z "$PREV_TAG" ]; then
              echo "ERROR: No previous deployment tag found; refusing deployment." >&2
              exit 1
            fi

            # Normalize legacy raw SHA tags to the image tag format.
            if [[ "$PREV_TAG" =~ ^[0-9a-f]{40}$ ]]; then
              PREV_TAG="sha-$PREV_TAG"
            fi

            echo "Previous deployment tag: $PREV_TAG"

            export IMAGE_BACKEND IMAGE_PANEL IMAGE_MCP
            export DOCKER_TAG="sha-$COMMIT_SHA"

            # Rollback is phase-aware; before migrations, leave running services unchanged.
            DEPLOY_PHASE="pre-migration"

            rollback() {
              rc=$?
              trap - ERR
              echo "ERROR: Deployment failed during $DEPLOY_PHASE (exit $rc)." >&2

              if [ "$DEPLOY_PHASE" = "pre-migration" ]; then
                echo "No migration was started; leaving running services unchanged." >&2
                exit "$rc"
              fi

              echo "Attempting application-image rollback to $PREV_TAG." >&2
              export DOCKER_TAG="$PREV_TAG"
              if docker compose pull api worker scheduler reverb panel mcp &&
                 docker compose up -d --remove-orphans; then
                echo "Rollback commands completed. Verify application health and database compatibility." >&2
              else
                echo "CRITICAL: Automatic application rollback failed; manual intervention is required." >&2
              fi
              echo "WARNING: Database migrations are not automatically reversed." >&2
              exit "$rc"
            }

            trap rollback ERR

            # Pull all required images before touching the database.
            docker compose pull api worker scheduler reverb panel mcp

            # Back up the production database before running migrations.
            echo "--> Creating pre-migration database backup..."
            BACKUP_FILE="/root/lamsuite_billing_predeploy_$(date +%Y%m%d_%H%M%S).sql"
            if ! docker compose exec -T db sh -c 'exec mysqldump --user="$MYSQL_USER" --password="$MYSQL_PASSWORD" --single-transaction --routines --triggers --no-tablespaces "$MYSQL_DATABASE"' > "$BACKUP_FILE"; then
              rm -f "$BACKUP_FILE"
              echo "ERROR: Database backup failed; refusing to run migrations." >&2
              exit 1
            fi
            chmod 600 "$BACKUP_FILE"
            if ! test -s "$BACKUP_FILE" || ! grep -q -- '-- Dump completed on' "$BACKUP_FILE"; then
              echo "ERROR: Database backup verification failed; refusing to run migrations." >&2
              rm -f "$BACKUP_FILE"
              exit 1
            fi
            echo "Database backup completed: $BACKUP_FILE"

            DEPLOY_PHASE="migration"
            echo "--> Running database migrations..."
            docker compose run --rm --no-deps api php artisan migrate --force

            DEPLOY_PHASE="cache-warmup"
            echo "--> Warming application caches..."
            docker compose run --rm --no-deps api php artisan config:cache
            docker compose run --rm --no-deps api php artisan route:cache
            docker compose run --rm --no-deps api php artisan view:cache

            DEPLOY_PHASE="service-start"
            echo "--> Starting application services..."
            docker compose up -d --remove-orphans

            DEPLOY_PHASE="health-check"
            echo "--> Checking deployment health..."
            source .env

            for i in $(seq 1 12); do
              API_HEALTH=$(curl -sk -o /dev/null -w "%{http_code}" "https://${SUBDOMAIN_API}.${DOMAIN}/up" || true)
              PANEL_HEALTH=$(curl -sk -o /dev/null -w "%{http_code}" "https://${SUBDOMAIN_PANEL}.${DOMAIN}/health" || true)
              MCP_HEALTH=$(curl -sk -o /dev/null -w "%{http_code}" "https://${SUBDOMAIN_MCP}.${DOMAIN}/health" || true)

              if [ "$API_HEALTH" = "200" ] &&
                [ "$PANEL_HEALTH" = "200" ] &&
                [ "$MCP_HEALTH" = "200" ]; then
                echo "All health checks passed."
                trap - ERR
                echo "sha-$COMMIT_SHA" > .current_deploy_tag
                echo "Deployment successfully verified."
                exit 0
              fi

              echo "Health check attempt $i/12 failed (API=$API_HEALTH, Panel=$PANEL_HEALTH, MCP=$MCP_HEALTH)."
              sleep 5
            done

            echo "ERROR: Health checks failed after retries." >&2
            exit 1
