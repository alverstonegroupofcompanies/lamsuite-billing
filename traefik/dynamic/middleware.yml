# Traefik Dynamic Configuration: Middlewares & Security Profiles
http:
  middlewares:
    # Production Security Headers
    security-headers:
      headers:
        hostsProxyHeaders:
          - "X-Forwarded-Host"
        sslProxyHeaders:
          X-Forwarded-Proto: https
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true
        frameDeny: false
        customFrameOptionsValue: "SAMEORIGIN"
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        permissionsPolicy: "camera=(), microphone=(), geolocation=()"

    # High-efficiency Gzip Compression
    gzip-compress:
      compress:
        minResponseBodyBytes: 1024

    # Rate Limiting for Auth & Activation Endpoints (Anti-Brute Force)
    rate-limit-auth:
      rateLimit:
        average: 10
        burst: 20
        period: 1m
        sourceCriterion:
          requestHeaderName: "X-Forwarded-For"

    # Strict Rate Limiting for LAN Pairing & Enrollment
    rate-limit-sensitive:
      rateLimit:
        average: 5
        burst: 10
        period: 1m
        sourceCriterion:
          requestHeaderName: "X-Forwarded-For"

    # Traefik Dashboard Basic Authentication
    traefik-dashboard-auth:
      basicAuth:
        users:
          - "admin:$2y$05$cFW0UoenVeDrUyw.7v6vzONcmrIICNC4YJbnfRSwNsmnDYYutayni"

    # Extra authentication for phpMyAdmin
    secretpanel-auth:
      basicAuth:
        usersFile: /etc/traefik/dynamic/secretpanel.htpasswd
        realm: "Restricted phpMyAdmin"
        removeHeader: true

    # Remove the public URL prefix before forwarding to phpMyAdmin
    secretpanel-strip:
      stripPrefix:
        prefixes:
          - /secretpanel2026
