[package]
name = "lamsuite-billing"
version = "2.0.9"
description = "LamSuite Billing Desktop"
authors = ["Muhammad Anshad <muhammad.anshad@teronext.com>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = [ "fs-all", "shell-all",
  "dialog-all",
  "http-all",
  "window-all",
  "updater",
  "devtools"
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
parking_lot = "0.12"
local-ip-address = "0.6"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
